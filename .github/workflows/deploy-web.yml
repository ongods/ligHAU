name: Deploy web demo

# Verify Flutter and backend checks, then publish static files to GitHub Pages.
# Set Pages source to GitHub Actions, MAPTILER_KEY as a repository secret, and
# CHAT_API_BASE_URL as a repository variable. Run the Docker backend separately.
# Database URLs and provider credentials belong only in backend-host secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      # A fresh copy of the template has no Flutter app in it yet. Skip quietly
      # rather than failing, so your repo is not red before you have written
      # anything. Once pubspec.yaml exists, every push deploys.
      - id: check
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -f pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pubspec.yaml yet. Add your Flutter app and this workflow will deploy it."
          fi
          # GitHub Pages only publishes PUBLIC repositories on a free account.
          # Say so loudly rather than failing the deploy with a confusing 404.
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::This repository is private, so GitHub Pages cannot publish it and the deploy step is skipped. Make the repository public (Settings > General > Danger Zone > Change visibility) to get your live link."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      # Verification is required before publication.
      - if: steps.check.outputs.ready == 'true'
        run: flutter analyze

      - if: steps.check.outputs.ready == 'true'
        run: flutter test

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend security, persistence and recovery tests
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          node --test server/*.test.mjs

      - name: Isolated backend stress test
        if: steps.check.outputs.ready == 'true'
        run: node server/stress-test.mjs --soak-seconds=30

      - name: Isolated Postgres migration and integration tests
        if: steps.check.outputs.ready == 'true'
        run: node tools/test-postgres.mjs

      - name: Build web
        if: steps.check.outputs.ready == 'true'
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          CHAT_API_BASE_URL: ${{ vars.CHAT_API_BASE_URL }}
        # --base-href matters: on a project page the site lives at
        # username.github.io/<repo>/, and without it every asset 404s and you get
        # a white screen.
        run: |
          node --input-type=module -e '
            const value = process.env.CHAT_API_BASE_URL;
            if (!value) throw new Error("Set the CHAT_API_BASE_URL repository variable to your backend HTTPS origin.");
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) {
              throw new Error("CHAT_API_BASE_URL must be an HTTPS origin, such as https://api.example.com, without a path or credentials.");
            }
          '
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define="MAPTILER_KEY=$MAPTILER_KEY" \
            --dart-define="CHAT_API_BASE_URL=$CHAT_API_BASE_URL"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    # Skipped, not failed, when there is no app yet or the repo is private.
    if: needs.build.outputs.ready == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
