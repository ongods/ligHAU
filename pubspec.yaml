# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: ligHAU campus guide for Holy Angel University.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Keep the icon font referenced by Flutter's release build.
  cupertino_icons: ^1.0.9
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  maplibre_gl: ^0.27.1
  http: ^1.6.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/data/hau_osm.json
    - assets/fonts/OFL.txt
    - assets/branding/maptiler-logo.svg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/
